<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Tài khoản')}"></head>
<body class="admin-body">

<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('users')}"></aside>

    <main class="admin-main">

        <div class="admin-bar">
            <div>
                <h1 th:text="${isNew} ? 'Thêm tài khoản' : 'Sửa tài khoản'">Thêm tài khoản</h1>
                <p class="sub" th:if="${isNew}">Tạo tài khoản cho nhân viên hoặc khách hàng.</p>
                <p class="sub" th:if="${!isNew}">
                    Đang sửa <b th:text="${editingUser.fullName}">Tên</b> ·
                    <span th:text="${editingUser.phone}">SĐT</span>
                </p>
            </div>
            <div class="right">
                <a class="btn btn-outline btn-sm" th:href="@{/admin/users}">
                    <svg class="icon icon-sm"><use href="#i-chevron-left"/></svg>
                    Danh sách
                </a>
            </div>
        </div>

        <div th:replace="~{fragments/layout :: alerts}"></div>
        <div class="alert alert-danger" th:if="${errorMessage}">
            <svg class="icon"><use href="#i-alert"/></svg>
            <span th:text="${errorMessage}"></span>
        </div>

        <form class="form-card" style="max-width:860px" th:action="@{/admin/users/save}"
              th:object="${userForm}" method="post">
            <input type="hidden" name="id" th:if="${!isNew}" th:value="${editingUser.id}">

            <div class="form-grid">
                <div class="field">
                    <label for="fullName">Họ và tên</label>
                    <input type="text" id="fullName" th:field="*{fullName}" maxlength="100" required>
                    <span class="field-error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
                </div>
                <div class="field">
                    <label for="phone">Số điện thoại (dùng để đăng nhập)</label>
                    <input type="tel" id="phone" th:field="*{phone}" maxlength="15" required>
                    <span class="field-error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
                </div>
                <div class="field">
                    <label for="email">Email (không bắt buộc)</label>
                    <input type="email" id="email" th:field="*{email}" maxlength="120">
                    <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
                </div>
                <div class="field">
                    <label for="roleCode">Vai trò</label>
                    <select id="roleCode" th:field="*{roleCode}" required>
                        <option th:each="r : ${roles}" th:value="${r.code}" th:text="${r.name}">Khách hàng</option>
                    </select>
                    <span class="field-error" th:if="${#fields.hasErrors('roleCode')}" th:errors="*{roleCode}"></span>
                </div>
                <div class="field">
                    <label for="status">Trạng thái</label>
                    <select id="status" th:field="*{status}" required>
                        <option th:each="s : ${statuses}" th:value="${s}"
                                th:text="${s.name() == 'ACTIVE' ? 'Đang hoạt động' : (s.name() == 'LOCKED' ? 'Bị khoá' : 'Ngừng dùng')}">
                            Đang hoạt động
                        </option>
                    </select>
                </div>
                <div class="field">
                    <label for="position">Chức danh (cho nhân viên)</label>
                    <input type="text" id="position" th:field="*{position}" maxlength="50"
                           placeholder="Thu ngân, Pha chế...">
                </div>
            </div>

            <div class="field">
                <label for="password" th:text="${isNew} ? 'Mật khẩu' : 'Mật khẩu mới (để trống nếu không đổi)'">Mật khẩu</label>
                <input type="password" id="password" th:field="*{password}"
                       th:required="${isNew}" minlength="6" autocomplete="new-password"
                       placeholder="Tối thiểu 6 ký tự">
                <span class="field-hint">Đặt lại mật khẩu cho người dùng cũng dùng ô này.</span>
                <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
            </div>

            <div style="display:flex;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)">
                <button class="btn btn-primary" type="submit">
                    <svg class="icon icon-sm"><use href="#i-check"/></svg>
                    <span th:text="${isNew} ? 'Tạo tài khoản' : 'Lưu thay đổi'">Lưu</span>
                </button>
                <a class="btn btn-outline" th:href="@{/admin/users}">Huỷ</a>
            </div>
        </form>

    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
