<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Danh mục')}"></head>
<body class="admin-body">

<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('categories')}"></aside>

    <main class="admin-main">

        <div class="admin-bar">
            <div>
                <h1>Danh mục đồ uống</h1>
                <p class="sub">Sắp xếp thứ tự hiển thị trên menu của cửa hàng</p>
            </div>
        </div>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <div class="panel" style="margin-bottom:22px">
            <div class="panel-head"><h2>Thêm danh mục mới</h2></div>
            <div class="panel-body">
                <form th:action="@{/admin/categories/save}" method="post"
                      style="display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end">
                    <div class="field" style="flex:2;min-width:200px;margin:0">
                        <label for="newName">Tên danh mục</label>
                        <input type="text" id="newName" name="name" required maxlength="100" placeholder="Ví dụ: Cà phê muối">
                    </div>
                    <div class="field" style="flex:1;min-width:110px;margin:0">
                        <label for="newSort">Thứ tự</label>
                        <input type="number" id="newSort" name="sortOrder" value="0">
                    </div>
                    <label class="check" style="margin-bottom:12px">
                        <input type="checkbox" name="active" value="true" checked> Hiển thị
                    </label>
                    <button class="btn btn-primary" type="submit" style="margin-bottom:1px">
                        <svg class="icon icon-sm"><use href="#i-plus"/></svg>
                        Thêm
                    </button>
                </form>
            </div>
        </div>

        <div class="table-card">
            <div class="table-scroll">
                <table class="data">
                    <thead>
                    <tr>
                        <th style="width:64px">ID</th>
                        <th>Tên &amp; cài đặt</th>
                        <th style="width:92px">Thứ tự</th>
                        <th>Hiển thị</th>
                        <th class="actions">Thao tác</th>
                    </tr>
                    </thead>
                    <tbody>
                    <tr th:each="c : ${categories}">
                        <td class="muted" th:text="${c.id}">1</td>
                        <td>
                            <form th:action="@{/admin/categories/save}" method="post"
                                  style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
                                <input type="hidden" name="id" th:value="${c.id}">
                                <input type="text" name="name" th:value="${c.name}" required maxlength="100"
                                       style="max-width:250px">
                                <label class="check">
                                    <input type="checkbox" name="active" value="true" th:checked="${c.active}"> Hiện
                                </label>
                                <button class="btn btn-sm btn-outline" type="submit">Lưu</button>
                            </form>
                        </td>
                        <td>
                            <form th:action="@{/admin/categories/save}" method="post">
                                <input type="hidden" name="id" th:value="${c.id}">
                                <input type="hidden" name="name" th:value="${c.name}">
                                <input type="hidden" name="active" value="true" th:if="${c.active}">
                                <input type="number" name="sortOrder" th:value="${c.sortOrder}"
                                       style="max-width:80px" onchange="this.form.submit()">
                            </form>
                        </td>
                        <td>
                            <span class="badge badge-success" th:if="${c.active}">Đang hiện</span>
                            <span class="badge badge-secondary" th:unless="${c.active}">Đang ẩn</span>
                        </td>
                        <td class="actions">
                            <form th:action="@{/admin/categories/{id}/delete(id=${c.id})}" method="post"
                                  data-confirm="Xoá danh mục này?">
                                <button class="btn btn-sm btn-danger" type="submit">
                                    <svg class="icon icon-sm"><use href="#i-trash"/></svg>
                                </button>
                            </form>
                        </td>
                    </tr>
                    <tr th:if="${categories.isEmpty()}">
                        <td colspan="5" class="muted">Chưa có danh mục.</td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
