<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Mã giảm giá')}"></head>
<body class="admin-body">

<div class="admin-shell">
    <aside th:replace="~{fragments/admin :: sidebar('vouchers')}"></aside>

    <main class="admin-main">

        <div class="admin-bar">
            <div>
                <h1 th:text="${isNew} ? 'Tạo mã giảm giá' : 'Sửa mã giảm giá'">Tạo mã</h1>
                <p class="sub">Mã PERCENT cần nhập “giảm tối đa” để giới hạn số tiền được giảm.</p>
            </div>
            <div class="right">
                <a class="btn btn-outline btn-sm" th:href="@{/admin/vouchers}">
                    <svg class="icon icon-sm"><use href="#i-chevron-left"/></svg>
                    Danh sách
                </a>
            </div>
        </div>

        <div th:replace="~{fragments/layout :: alerts}"></div>

        <form class="form-card" th:action="@{/admin/vouchers/save}" method="post" style="max-width:860px">
            <input type="hidden" name="id" th:if="${!isNew}" th:value="${voucher.id}">

            <div class="form-grid">
                <div class="field">
                    <label for="code">Mã giảm giá</label>
                    <input type="text" id="code" name="code" th:value="${voucher.code}" required maxlength="30"
                           style="text-transform:uppercase;letter-spacing:.06em;font-weight:700"
                           placeholder="WELCOME10">
                </div>
                <div class="field">
                    <label for="discountType">Kiểu giảm</label>
                    <select id="discountType" name="discountType" required>
                        <option th:each="t : ${discountTypes}" th:value="${t}"
                                th:selected="${voucher.discountType != null and voucher.discountType.name() == t.name()}"
                                th:text="${t.label}">Giảm theo %</option>
                    </select>
                </div>
            </div>

            <div class="form-grid">
                <div class="field">
                    <label for="discountValue">Giá trị giảm (% hoặc đồng)</label>
                    <input type="number" id="discountValue" name="discountValue"
                           th:value="${voucher.discountValue}" min="0" step="1000" required>
                </div>
                <div class="field">
                    <label for="maxDiscount">Giảm tối đa (chỉ cho %)</label>
                    <input type="number" id="maxDiscount" name="maxDiscount"
                           th:value="${voucher.maxDiscount}" min="0" step="1000" placeholder="20000">
                </div>
                <div class="field">
                    <label for="minOrderAmount">Đơn tối thiểu (đồng)</label>
                    <input type="number" id="minOrderAmount" name="minOrderAmount"
                           th:value="${voucher.minOrderAmount}" min="0" step="1000">
                </div>
                <div class="field">
                    <label for="usageLimit">Giới hạn lượt dùng</label>
                    <input type="number" id="usageLimit" name="usageLimit"
                           th:value="${voucher.usageLimit}" min="1" placeholder="Bỏ trống = không giới hạn">
                </div>
            </div>

            <div class="form-grid">
                <div class="field">
                    <label for="startDate">Bắt đầu</label>
                    <input type="datetime-local" id="startDate" name="startDate"
                           th:value="${@fmt.htmlDate(voucher.startDate)}" required>
                </div>
                <div class="field">
                    <label for="endDate">Kết thúc</label>
                    <input type="datetime-local" id="endDate" name="endDate"
                           th:value="${@fmt.htmlDate(voucher.endDate)}" required>
                </div>
            </div>

            <div class="field">
                <label for="description">Mô tả hiển thị cho khách</label>
                <input type="text" id="description" name="description" th:value="${voucher.description}"
                       maxlength="255" placeholder="Giảm 10% cho khách mới (tối đa 20k)">
            </div>

            <div class="field">
                <label class="check">
                    <input type="checkbox" name="active" value="true" th:checked="${isNew or voucher.active}">
                    Đang áp dụng
                </label>
            </div>

            <div style="display:flex;gap:10px;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)">
                <button class="btn btn-primary" type="submit">
                    <svg class="icon icon-sm"><use href="#i-check"/></svg>
                    Lưu mã giảm giá
                </button>
                <a class="btn btn-outline" th:href="@{/admin/vouchers}">Huỷ</a>
            </div>
        </form>

    </main>
</div>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
