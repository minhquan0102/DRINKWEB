<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Không có quyền')}"></head>
<body>

<header th:replace="~{fragments/layout :: navbar}"></header>

<main class="page">
    <div class="container">
        <div class="empty" style="max-width:620px;margin:60px auto">
            <div class="empty-ico" style="background:var(--red-soft);color:var(--red)">
                <svg class="icon icon-lg"><use href="#i-shield"/></svg>
            </div>
            <h3>Bạn không có quyền truy cập</h3>
            <p>Tài khoản hiện tại không được phép mở trang này. Nếu đây là nhầm lẫn, hãy đăng nhập bằng tài khoản phù hợp.</p>
            <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">
                <a class="btn btn-primary" th:href="@{/}">Về trang chủ</a>
                <a class="btn btn-outline" th:href="@{/menu}">Xem menu</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
