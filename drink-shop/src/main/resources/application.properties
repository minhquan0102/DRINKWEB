# =====================================================================
# CẤU HÌNH ỨNG DỤNG - APP BÁN NƯỚC GIẢI KHÁT
# =====================================================================
spring.application.name=drink-shop
# Mặc định 8080. Nếu cổng bận: set SERVER_PORT=8081 rồi chạy lại
# (PowerShell: $env:SERVER_PORT=8081 ; cmd: set SERVER_PORT=8081)
server.port=${SERVER_PORT:8080}

# ---------- KẾT NỐI MySQL ----------
spring.datasource.url=jdbc:mysql://localhost:3306/drink_shop?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&useSSL=false
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / HIBERNATE ----------
# CSDL đã được tạo sẵn bằng script app_ban_nuoc.sql => không cho Hibernate sửa cấu trúc
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# ---------- THYMELEAF ----------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML

# ---------- MÃ HÓA / ĐĂNG NHẬP ----------
# Tài khoản demo dùng chung mật khẩu: 123456
app.demo-password=123456

# ---------- LOG ----------
logging.level.com.drinkshop=INFO
logging.level.org.hibernate.SQL=WARN

# =====================================================================
# THANH TOÁN VNPAY (merchant sandbox đã cấp)
# - simulate=false : chuyển thật sang cổng sandbox.vnpayment.vn
# - simulate=true  : dùng trang mô phỏng nội bộ (khi không có mạng/merchant)
# - IPN URL khai báo với VNPAY: <domain>/payment/vnpay/ipn
#   (VNPay gọi server-to-server nên URL này cần domain công khai,
#    ví dụ dùng ngrok/cloudflared khi chạy ở máy cá nhân)
# =====================================================================
app.vnpay.tmn-code=TZE62LK1
app.vnpay.hash-secret=7980T99V8SREPRP2LYPFSZO59W8AKQ78
app.vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
# Có thể override bằng biến môi trường khi dùng ngrok/cloudflared:
#   set VNPAY_RETURN_URL=https://abc.ngrok-free.app/payment/vnpay/return
#   set VNPAY_IPN_URL=https://abc.ngrok-free.app/payment/vnpay/ipn
app.vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/payment/vnpay/return}
app.vnpay.ipn-url=${VNPAY_IPN_URL:http://localhost:8080/payment/vnpay/ipn}
# true  = dùng trang mô phỏng nội bộ (demo được ngay khi merchant sandbox chưa duyệt website)
# false = chuyển thật sang sandbox.vnpayment.vn (cần terminal đã được duyệt)
app.vnpay.simulate=true

